name: Build and Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile and bundle
        run: npm run build

      - name: Package Windows binaries
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FreeGameCompressor-Windows
          path: |
            release/*.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux (.AppImage, .deb)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install system dependencies for Linux AppImage packaging
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools libfuse2

      - name: Install dependencies
        run: npm ci

      - name: Compile and bundle
        run: npm run build

      - name: Package Linux binaries (AppImage, deb, tar.gz)
        run: npx electron-builder --linux AppImage deb tar.gz --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FreeGameCompressor-Linux
          path: |
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
          if-no-files-found: error

  build-macos:
    name: Build macOS (.dmg, .zip)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile and bundle
        run: npm run build

      - name: Package macOS binaries (dmg, zip for arm64 & x64)
        run: npx electron-builder --mac dmg zip --universal --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FreeGameCompressor-macOS
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Organize artifacts for release
        run: |
          mkdir -p dist-release
          find release-artifacts -type f \( -name "*.exe" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.tar.gz" -o -name "*.dmg" -o -name "*.zip" \) -exec cp {} dist-release/ \;
          ls -la dist-release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
