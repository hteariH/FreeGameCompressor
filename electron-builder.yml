appId: com.antigravity.freegamecompressor
productName: FreeGameCompressor
directories:
  output: release
  buildResources: build
files:
  - dist
  - dist-electron
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  requestedExecutionLevel: asInvoker
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: tar.gz
      arch:
        - x64
  category: Utility
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
